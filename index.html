<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Morning Pick</title>
<meta name="description" content="Workout planner and tracker: gym, home, treadmill and swim.">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101419" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Morning Pick">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app. Each training mode wears the colour of a competition bumper plate
   (red 25 kg = gym, green 10 kg = home, blue 20 kg = run, yellow 15 kg = swim). Bottom tab bar. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#E3E8ED; --ink:#14181D; --muted:#59626E; --line:#D3DAE1;
  --gym:#C8202F; --home:#1E8A4C; --run:#1F5FBF; --swim:#E6B31E; --on-plate:#FFFFFF; --on-swim:#1D1A10;
  --warn-bg:#FFF4D6; --warn-ink:#6B4B00; --ok:#1E8A4C;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101419; --surface:#1A2027; --sunk:#232A33; --ink:#E7EBEF; --muted:#9AA5B1; --line:#2D3640;
  --gym:#E5414E; --home:#35B06A; --run:#4C8CEB; --swim:#F0C23A; --on-plate:#FFFFFF; --on-swim:#1D1A10;
  --warn-bg:#3A3015; --warn-ink:#F4D98A; --ok:#35B06A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101419; --surface:#1A2027; --sunk:#232A33; --ink:#E7EBEF; --muted:#9AA5B1; --line:#2D3640;
  --gym:#E5414E; --home:#35B06A; --run:#4C8CEB; --swim:#F0C23A; --on-plate:#FFFFFF; --on-swim:#1D1A10;
  --warn-bg:#3A3015; --warn-ink:#F4D98A; --ok:#35B06A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:34px}
h2{font-size:24px}
h3{font-size:20px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--run);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px}
textarea{width:100%;padding:10px;min-height:70px;resize:vertical}

header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}

.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:10px 12px;font-size:14px}
.panel ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.panel h3{margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}

/* mode picker */
.picker{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.picker{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.mode .plate{background:var(--c);color:var(--on-plate);padding:10px 12px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mode.swim .plate{color:var(--on-swim)}
.mode .plate b{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1}
.mode .plate span{font-family:var(--f-display);font-size:14px;font-weight:600;opacity:.85}
.mode .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.mode .next{font-weight:600;font-size:15px;line-height:1.3}
.mode .meta{font-size:13px;color:var(--muted)}
.mode .warn{font-size:12.5px;color:var(--warn-ink);background:var(--warn-bg);border-radius:6px;padding:6px 8px}
.mode .acts{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.go{flex:1;background:var(--c);color:var(--on-plate);border:0;border-radius:8px;padding:10px;font-weight:600}
.mode.swim .go{color:var(--on-swim)}
.alt{background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--muted);font-size:13px}
.gym{--c:var(--gym)} .home{--c:var(--home)} .run{--c:var(--run)} .swim{--c:var(--swim)}

/* active session */
.sess-head{display:flex;flex-direction:column;gap:8px;border-left:6px solid var(--c);padding-left:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.chip::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--c,var(--ink));color:var(--on-plate);border-color:transparent;font-weight:600;padding:12px 16px}
.swim .btn.primary{color:var(--on-swim)}
.btn.danger{color:var(--gym);border-color:var(--gym)}
.btn.block{width:100%}
.btn.sm{padding:8px 10px;min-width:40px;min-height:40px}
details>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:9px;height:9px;flex:none;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .15s}
details[open]>summary::after{transform:rotate(225deg);margin:4px 4px 0 0}
details.panel[open]>summary{margin-bottom:2px}
.rlist{display:flex;flex-direction:column}
.rlist details{border-top:1px solid var(--line);padding:9px 0}
.rlist details:first-child{border-top:0;padding-top:0}
.rlist summary span{font-weight:400}
.rlist details>div{padding-top:4px}
.tag{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--c);margin-left:6px;white-space:nowrap}
.btn:disabled{opacity:.35}
.ed .btn.primary{background:var(--ink);color:var(--bg)}
.logs select{padding:8px;width:100%;font-size:16px}
.logs .full{grid-column:1/-1}
.logs textarea{font-size:16px}
.seg{gap:6px}
.edrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.edrow.cur{box-shadow:inset 4px 0 0 var(--c)}
.edrow>span{min-width:0}
.edrow>span:first-child{flex:1 1 150px}
.edrow>.row{margin-left:auto;flex-wrap:nowrap;gap:6px}
.ed{display:flex;flex-direction:column;gap:12px}
.ed>header{margin-bottom:-4px}
label.btn{cursor:pointer;display:inline-block}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-top>div{min-width:0}
.ex-name{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1}
.target{font-size:13px;color:var(--muted)}
.cue{font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--c);color:var(--on-plate)}
.swim .badge{color:var(--on-swim)}
.lastline{font-size:13px}
.lastline b{font-weight:600}
.plates{font-size:12.5px;color:var(--muted)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:20px minmax(0,1.5fr) minmax(0,1fr) 44px;gap:6px;align-items:center}
.set.nw{grid-template-columns:20px minmax(0,1fr) 44px}
.sethead{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:-2px}
.set .n{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.field{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.field input{border:0;background:transparent;width:100%;min-width:0;text-align:center;padding:10px 0;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.field .pm{border:0;background:transparent;width:34px;height:42px;font-size:18px;color:var(--muted);flex:none}
.tick{width:44px;height:44px;border-radius:8px;border:2px solid var(--line);background:transparent;font-size:18px;color:var(--muted)}
.set.done .tick{background:var(--c);border-color:var(--c);color:var(--on-plate)}
.set.done .field{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.links{display:flex;gap:14px;flex-wrap:wrap}
.link{background:none;border:0;padding:8px 0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.lvl{display:flex;align-items:center;gap:8px}
.lvl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.lvl button:disabled{opacity:.35}
.lvl .pips{display:flex;gap:4px}
.lvl .pips i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.lvl .pips i.f{background:var(--c)}

.block{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.block:first-child{border-top:0;padding-top:0}
.block .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.speed{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;text-align:right;color:var(--c)}
.speed small{font-size:13px;color:var(--muted);font-weight:600;display:block}
.chk{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--muted)}
.chk.on{background:var(--c);border-color:var(--c);color:var(--on-swim)}
.logs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.logs label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.logs input{padding:8px;width:100%;font-size:16px;font-variant-numeric:tabular-nums}

/* timer */
body.has-timer{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 8px}
.timer .in{max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer .t{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:72px}
.timer .bar{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--bg)}
.timer button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px}
.timer.over .in{background:var(--home);color:#fff}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav.tabs button{background:none;border:0;padding:10px 4px;border-radius:8px;font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--muted);letter-spacing:.02em}
nav.tabs button.on{color:var(--ink);background:var(--sunk)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.xbtn{position:sticky;top:0;align-self:flex-end;margin-bottom:-46px;width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:16px;z-index:1}
.sheet h2{padding-right:48px}
.sheet input[type=search]{padding:10px 12px;font-size:16px;width:100%}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:82%;overflow:auto;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.opt.cur{border-color:var(--c);box-shadow:inset 4px 0 0 var(--c)}
.opt span{min-width:0}

/* history */
.hist{display:flex;flex-direction:column;gap:8px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.hcard .row{justify-content:space-between}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td.num{white-space:nowrap}
table.t td,table.t th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
table.t tr.cur td{font-weight:600}
table.t tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--c)}
.tw{overflow-x:auto}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
/* narrow phones: these must come after the base rules */
@media (max-width:360px){.ex,.panel{padding:12px}}
@media (max-width:340px){.field .pm{width:26px}.set{gap:5px}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div id="timer"></div>
<nav class="tabs"><div class="in">
  <button id="tab-today" data-act="tab" data-v="today">Today</button>
  <button id="tab-history" data-act="tab" data-v="history">History</button>
  <button id="tab-plan" data-act="tab" data-v="plan">Plan</button>
</div></nav>
<div id="sheet"></div>
<div id="toast"></div>

<script>
/* ===================== PROGRAMME DATA ===================== */
const ROT=['UA','LA','UB','LB'];
const DAYNAME={UA:'Upper A',LA:'Lower A',UB:'Upper B',LB:'Lower B'};
const DAYFOCUS={UA:'Bench focus',LA:'Squat focus',UB:'Overhead press focus',LB:'Deadlift focus'};

// k: bb barbell, db dumbbell (weight per hand), mc machine/cable, as assisted machine (weight = assistance, lower is harder), t timed, r reps only
const GYM={
 bench:{n:'Bench press',k:'bb',lo:6,hi:8,s:3,inc:2.5,start:35,rest:150,cue:'Shoulder blades pinned, bar to lower chest, feet planted.',alts:['db_bench','machine_press']},
 db_bench:{n:'Dumbbell bench press',k:'db',lo:8,hi:10,s:3,inc:2,start:14,rest:120,cue:'Weight shown is per dumbbell.'},
 machine_press:{n:'Machine chest press',k:'mc',lo:8,hi:12,s:3,inc:5,start:30,rest:120,cue:'Handles at mid-chest height.'},
 row:{n:'Barbell row',k:'bb',lo:8,hi:10,s:3,inc:2.5,start:30,rest:120,cue:'Hinge to about 45°, pull to your belly button, no jerking.',alts:['cs_row','cable_row']},
 cs_row:{n:'Chest-supported DB row',k:'db',lo:8,hi:12,s:3,inc:2,start:12,rest:90,cue:'Chest on an incline bench, weight per dumbbell.'},
 cable_row:{n:'Seated cable row',k:'mc',lo:10,hi:12,s:3,inc:5,start:35,rest:90,cue:'Chest up, squeeze shoulder blades together at the end.',alts:['cs_row']},
 db_ohp:{n:'Seated DB shoulder press',k:'db',lo:8,hi:12,s:3,inc:2,start:10,rest:90,cue:'Weight per dumbbell. Elbows slightly in front of the body.',alts:['machine_ohp']},
 machine_ohp:{n:'Machine shoulder press',k:'mc',lo:8,hi:12,s:3,inc:5,start:20,rest:90,cue:''},
 pulldown:{n:'Lat pulldown',k:'mc',lo:8,hi:12,s:3,inc:5,start:35,rest:90,cue:'Pull elbows down to your ribs, chest up to meet the bar.',alts:['ng_pulldown','assisted_pullup','cs_row']},
 ng_pulldown:{n:'Neutral-grip pulldown',k:'mc',lo:8,hi:12,s:3,inc:5,start:35,rest:90,cue:'Palms facing each other, pull to upper chest.',alts:['pulldown','assisted_pullup']},
 assisted_pullup:{n:'Assisted pull-up',k:'as',lo:6,hi:10,s:3,inc:5,start:35,rest:120,cue:'The number is how much the machine helps you. Lower is harder. Full hang at the bottom, chin over the bar.',alts:['pulldown','ng_pulldown']},
 assisted_dip:{n:'Assisted dip',k:'as',lo:6,hi:10,s:3,inc:5,start:30,rest:90,cue:'The number is how much the machine helps you. Lower is harder. Lean slightly forward, upper arms to parallel.',alts:['pushdown']},
 db_curl:{n:'Dumbbell curl',k:'db',lo:10,hi:12,s:2,inc:1,start:8,rest:60,cue:'Weight per dumbbell. Elbows stay by your sides.',alts:['cable_curl']},
 cable_curl:{n:'Cable curl',k:'mc',lo:10,hi:15,s:2,inc:2.5,start:15,rest:60,cue:''},
 squat:{n:'Back squat',k:'bb',lo:5,hi:8,s:3,inc:5,start:40,rest:180,cue:'Brace hard, sit down between your heels, hips at least to knee height.',alts:['smith_squat','goblet','leg_press']},
 smith_squat:{n:'Smith machine squat',k:'mc',lo:6,hi:10,s:3,inc:5,start:30,rest:150,cue:'Feet slightly in front of the bar.'},
 goblet:{n:'Goblet squat',k:'db',lo:10,hi:12,s:3,inc:2,start:16,rest:90,cue:'One dumbbell held at the chest.'},
 rdl:{n:'Romanian deadlift',k:'bb',lo:8,hi:10,s:3,inc:5,start:40,rest:120,cue:'Soft knees, push hips back, bar close to legs. Stop when hamstrings are tight.',alts:['db_rdl']},
 db_rdl:{n:'Dumbbell RDL',k:'db',lo:8,hi:12,s:3,inc:2,start:16,rest:90,cue:'Weight per dumbbell.'},
 leg_press:{n:'Leg press',k:'mc',lo:10,hi:12,s:2,inc:10,start:80,rest:120,cue:'Lower until hips start to tuck, then press.',alts:['goblet']},
 calf:{n:'Standing calf raise',k:'mc',lo:10,hi:15,s:3,inc:5,start:40,rest:60,cue:'Full stretch at the bottom, 1 s pause at the top.'},

const $=s=>document.querySelector(s);

const f1=x=>(Math.round(x*10)/10).toFixed(1);
const fw=w=>{const r=Math.round(w*100)/100;return Number.isInteger(r)?String(r):String(r).replace(/0+$/,'')};
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const pt=(km,v)=>mmss(km/v*3600);
const parseT=t=>{if(t==null||t==='')return null;const p=String(t).trim().split(':').map(Number);if(p.some(isNaN))return null;return p.length===1?p[0]*60:p.length===2?p[0]*60+p[1]:p[0]*3600+p[1]*60+p[2]};
const today=()=>new Date().toLocaleDateString('en-CA');
const dayOff=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};

function paces(fiveK){const v=5/(fiveK/3600);return{W:5.5,R:5.0,E:+f1(v*.82),L:+f1(v*.8),T:+f1(v*.94),I:+f1(v*1.06),F:+f1(v)}}

function swimLine(b,cyc){let s=(b.n>1?`${b.n} × ${b.d} m `:`${b.d} m `)+(b.txt||'');if(b.on){const on=Math.max(Math.min(105,b.on),b.on-15*(cyc-1));s+=` · leave every ${mmss(on)}`}else if(b.rest)s+=` · ${b.rest} s rest`;return s}
const swimDist=sw=>sw.b.reduce((a,b)=>a+(+b.n||0)*(+b.d||0),0);
const repMin=(b,p)=>b.km?b.km/p[b.z]*60:(b.sec||0)/60;
function blockMin(b,p){if(b.k==='reps')return(b.n||1)*(repMin(b,p)+(b.rec||0)/60);if(b.k==='dist')return(b.km||0)/p[b.z]*60;return+b.min||0}
function blockText(b,p){let s;
  if(b.k==='reps'){s=`${b.n} × `+(b.km?`${fw(b.km*1000)} m (about ${pt(b.km,p[b.z])} each)`:mmss(b.sec||0));if(b.note)s+=' '+b.note;if(b.rec)s+=`, ${mmss(b.rec)} ${b.recT||'walk'} between`}
  else if(b.k==='dist')s=`${fw(b.km)} km`+(b.note?'. '+b.note:'');
  else s=`${fw(+b.min||0)} min`+(b.note?' · '+b.note:'');
  return s}

const routines=(m='gym')=>P()[RKEY[m]]||PRESETS[m].map(r=>presetRoutine(r,m));

/* ---------- backup ---------- */
function backupDue(){if(SESS.length<5)return false;const l=lsGet('mp_lastExport');return!l||l<dayOff(-14)}
function exportData(){const data={app:'morning-pick',v:1,exported:new Date().toISOString(),state:S,sessions:SESS};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`morning-pick-${today()}.json`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);lsSet('mp_lastExport',today());render();toast('Backup downloaded.')}
async function importData(file){try{const d=JSON.parse(await file.text());
    if(!d||d.app!=='morning-pick'||typeof d.state!=='object'||!Array.isArray(d.sessions))throw 0;
    if(!confirm(`Replace everything on this device with the backup from ${String(d.exported||'').slice(0,10)||'unknown date'} (${d.sessions.length} sessions)?`))return;
    S=Object.assign(defState(),d.state);SESS=d.sessions.slice().sort((a,b)=>b.ts-a.ts);lsSet(LS_S,S);lsSet(LS_H,SESS);
    stopTimer();view='today';render();toast(`Restored ${SESS.length} sessions.`)}
  catch(e){toast('That file is not a Morning Pick backup.')}}

function gymItem(id,base){const e=gx(id),L=S.lifts[id];const w=L?L.w:e.start;
  const prev=L?.last||[];
  return{ex:id,base:base||id,name:e.n,k:e.k,lo:e.lo,hi:e.hi,rest:e.rest,up:!!L?.up,first:!L,
    sets:Array.from({length:e.s},(_,i)=>({w,r:prev[i]?.r??(e.k==='t'?e.lo:e.lo),done:false}))}}
function homeItem(id){const h=hx(id);const lv=homeLv(h,id);const L=S.lifts['h_'+id];
  return{ex:id,base:id,home:true,level:lv,u:h.u,lo:h.lo,hi:h.hi,rest:h.rest,up:!!L?.up,
    sets:Array.from({length:h.s},(_,i)=>({r:(L&&L.level===lv&&L.last?.[i]?.r)||h.lo,done:false}))}}
function buildRoutine(m,rid){const r=routines(m).find(x=>x.id===rid);if(!r)return null;
  return{id:uid(),date:today(),ts:Date.now(),mode:m,rid,title:r.n,items:routineEx(r,m).map(id=>m==='gym'?gymItem(id):homeItem(id)),notes:''}}
function buildRun(i){const r=runPlan()[i];return{id:uid(),date:today(),ts:Date.now(),mode:'run',idx:i,cycle:S.runCycle,rtype:r.t,title:r.n,b:clone(r.b),
  speeds:paces(S.fiveK),log:{min:'',km:'',rpe:'',test:''},notes:''}}
function buildSwim(i){const w=swimPlan()[i];return{id:uid(),date:today(),ts:Date.now(),mode:'swim',idx:i,cycle:S.swimCycle,stype:w.t,title:w.n,b:clone(w.b),dist:swimDist(w),
  checks:w.b.map(()=>false),log:{min:'',rpe:'',test:''},notes:''}}
function estMin(mode,key){if(mode==='gym')return routineEx(key).length*11;if(mode==='home')return routineEx(key,'home').length*8+5;
  if(mode==='run')return Math.round(runMin(runPlan()[key],paces(S.fiveK)));return Math.round(swimDist(swimPlan()[key])/50*2.6)+5}

/* ===================== FINISHING + PROGRESSION ===================== */
function finish(){const s=S.active;if(!s)return;let msg='Saved.';
  if(s.mode==='gym'||s.mode==='home'){
    for(const it of s.items){const done=it.sets.filter(x=>x.done);if(!done.length)continue;
      const hitTop=done.length>=it.sets.length&&done.every(x=>+x.r>=it.hi);
      if(it.home){const h=hx(it.ex);if(!h)continue;const nl=hitTop?Math.min(it.level+1,h.lv.length-1):it.level;
        S.levels[it.ex]=nl;S.lifts['h_'+it.ex]={level:it.level,up:nl>it.level,last:done.map(x=>({r:+x.r})),date:s.date}}
      else{const e=gx(it.ex)||{inc:0};const w=+done[0].w||0;const nw=(hitTop&&e.inc)?(isAs(it.k)?Math.max(0,w-e.inc):w+e.inc):w;
        S.lifts[it.ex]={w:nw,up:nw!==w,last:done.map(x=>({w:+x.w,r:+x.r})),date:s.date}}}}
  else if(s.mode==='run'){const t=parseT(s.log.test);
    if(s.rtype==='Test'){if(t&&t>600){S.fiveK=t;msg=`Saved. New 5K time ${mmss(t)}: run speeds updated.`}S.q.run=0;S.runCycle++}
    else S.q.run=(s.idx+1)%runPlan().length}
  else{const t=parseT(s.log.test);
    if(s.stype==='Test'){if(t)S.swim400=t;S.q.swim=0;S.swimCycle++;msg='Saved. Swim cycle '+S.swimCycle+' starts with send-offs 15 s faster.'}
    else S.q.swim=(s.idx+1)%swimPlan().length}
  s.done=true;s.ts=Date.now();saveSession(clone(s));S.active=null;save();stopTimer();releaseWake();view='today';sheet=null;render();toast(msg)}

/* ===================== GUARDRAILS ===================== */
function prevDay(){const y=dayOff(-1);return SESS.find(s=>s.date===y)}
const isLegs=s=>s&&(s.mode==='gym'||s.mode==='home')&&(s.day==='LA'||s.day==='LB'||s.items.some(i=>LOWER.has(i.ex)&&i.sets.some(x=>x.done)));
const isHardRun=s=>s&&s.mode==='run'&&['Intervals','Tempo','Test'].includes(s.rtype);
function warnFor(mode){const p=prevDay();if(!p)return'';
  if(mode==='run'&&isLegs(p)&&['Intervals','Tempo','Test'].includes(runPlan()[S.q.run].t))return'You trained legs yesterday. Consider picking an easy run instead.';
  if((mode==='gym'||mode==='home')&&isHardRun(p))return'Hard run yesterday. Go a little easier on leg exercises if your legs feel heavy.';
  return''}

/* ===================== RENDER ===================== */
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===(view==='edit'?'plan':view)));
  const a=$('#app');
  if(view==='today')a.innerHTML=S.active?renderActive():renderToday();
  else if(view==='history')a.innerHTML=renderHistory();
  else if(view==='edit'&&ED)a.innerHTML=renderEditor();
  else a.innerHTML=renderPlan();
  renderSheet();renderTimer();
}

function renderActive(){const s=S.active;const isStr=s.mode==='gym'||s.mode==='home';
  const doneSets=isStr?s.items.reduce((a,it)=>a+it.sets.filter(x=>x.done).length,0):0,allSets=isStr?s.items.reduce((a,it)=>a+it.sets.length,0):0;
  let h=`<div class="${s.mode}"><div class="sess-head"><span class="chip">${{gym:'Gym weights',home:'Home · no equipment',run:'Treadmill run',swim:'Swim · 50 m pool'}[s.mode]}</span>

   <button class="btn primary block" data-act="finish">Finish and save${isStr?` · ${doneSets} sets done`:''}</button></div>`;
  return h}

   ${it.sets.map((x,j)=>`<div class="set ${timed||ro?'nw':''} ${x.done?'done':''}"><span class="n">${j+1}</span>
     ${timed||ro?'':`<div class="field"><button class="pm" data-act="w" data-i="${i}" data-j="${j}" data-d="-1" aria-label="${isAs(it.k)?'Less assistance (harder)':'Less weight'}">−</button><input id="w${i}_${j}" inputmode="decimal" data-f="w" data-i="${i}" data-j="${j}" value="${fw(x.w)}" aria-label="${isAs(it.k)?'Assistance':'Weight'} set ${j+1}, ${unit}"><button class="pm" data-act="w" data-i="${i}" data-j="${j}" data-d="1" aria-label="${isAs(it.k)?'More assistance (easier)':'More weight'}">+</button></div>`}
     <div class="field"><input id="r${i}_${j}" inputmode="numeric" data-f="r" data-i="${i}" data-j="${j}" value="${esc(x.r)}" aria-label="${timed?'Seconds':'Reps'} set ${j+1}"></div>

function homeCard(it,i){const h=hx(it.ex)||{lv:[[it.name||it.ex,'']]};it.level=Math.min(it.level,h.lv.length-1);const[nm,cue]=h.lv[it.level];const L=S.lifts['h_'+it.ex];const sec=it.u==='sec';

function summary(s){if(s.items){const it=s.items.filter(i=>i.sets.some(x=>x.done));
  return it.slice(0,3).map(i=>{const d=i.sets.filter(x=>x.done);const nm=i.home?(hx(i.ex)?.lv[i.level]?.[0]||i.name||i.ex):i.name;
    return nm+' '+(i.home||i.k==='t'||i.k==='r'?d.map(x=>x.r).join('/'):kgTxt(isAs(i.k)?Math.min(...d.map(x=>+x.w)):Math.max(...d.map(x=>+x.w)),i.k)+' × '+d.map(x=>x.r).join('/'))}).join(' · ')+(it.length>3?` · +${it.length-3} more`:'')||'No sets ticked'}
  const l=s.log||{};const bits=[];if(l.min)bits.push(l.min+' min');if(l.km)bits.push(l.km+' km');if(s.mode==='swim'&&(s.dist??swimPlan()[s.idx]))bits.push((s.dist??swimDist(swimPlan()[s.idx]))+' m planned');if(l.test)bits.push('test '+l.test);if(l.rpe)bits.push('effort '+l.rpe+'/10');return bits.join(' · ')||'Logged'}

/* ---------- history ---------- */
let histEx=null,delArm=null;
function liftSeries(id){return SESS.filter(s=>s.mode==='gym').map(s=>{const it=s.items.find(i=>i.ex===id);if(!it)return null;
  const d=it.sets.filter(x=>x.done&&+x.r>0);if(!d.length)return null;
  if(isAs(it.k)){const top=d.reduce((a,x)=>+x.w<+a.w?x:a,d[0]);return{date:s.date,ts:s.ts,v:+top.w,top}}
  return{date:s.date,ts:s.ts,v:Math.max(...d.map(x=>e1rm(+x.w,+x.r))),top:d.reduce((a,x)=>+x.w>+a.w?x:a,d[0])}}).filter(Boolean).reverse()}
function chart(pts,lbl='Estimated one-rep max over time'){if(pts.length<2)return`<p class="small muted">One more session with this lift and a trend line appears here.</p>`;
  const W=320,H=150,pl=36,pr=10,pt_=12,pb=24;const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<5){lo-=2.5;hi+=2.5}
  lo=Math.floor(lo/5)*5;hi=Math.ceil(hi/5)*5;const x=i=>pl+i*(W-pl-pr)/(pts.length-1),y=v=>pt_+(hi-v)*(H-pt_-pb)/(hi-lo);
  const ticks=[lo,(lo+hi)/2,hi];const line=pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area=`${x(0)},${H-pb} ${line} ${x(pts.length-1)},${H-pb}`;const L=pts.length-1;
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${lbl}">
   ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${fw(Math.round(t*2)/2)}</text>`).join('')}
   <polygon points="${area}" fill="var(--gym)" fill-opacity=".12"/><polyline points="${line}" fill="none" stroke="var(--gym)" stroke-width="2.5" stroke-linejoin="round"/>
   <circle cx="${x(L)}" cy="${y(pts[L].v)}" r="4.5" fill="var(--gym)"/>
   <text x="${pl}" y="${H-6}">${nice(pts[0].date)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${nice(pts[L].date)}</text></svg>`}
function renderHistory(){
  const lifts=[...new Set(SESS.filter(s=>s.mode==='gym').flatMap(s=>s.items.filter(i=>i.sets.some(x=>x.done)&&!['t','r'].includes(i.k)).map(i=>i.ex)))];
  if(!histEx||!lifts.includes(histEx))histEx=lifts.includes('bench')?'bench':lifts[0];
  const ser=histEx?liftSeries(histEx):[];const lastPt=ser[ser.length-1];const asl=isAs(gx(histEx)?.k);
  const runs=SESS.filter(s=>s.mode==='run'&&s.rtype==='Test'&&parseT(s.log.test));
  const counts={gym:0,home:0,run:0,swim:0};const since=dayOff(-27);SESS.filter(s=>s.date>=since).forEach(s=>counts[s.mode]++);
  let h=`<header class="top"><div><div class="eyebrow">Your training</div><h1>History</h1></div>${syncTag()}</header>`;
  if(!SESS.length)return h+`<div class="empty"><h3>No sessions yet</h3><p>Finish your first workout on the Today tab and it shows up here, with a strength chart for every lift.</p></div>`;
  h+=`<div class="panel"><div class="eyebrow">Last 4 weeks</div><div class="row num">${['gym','home','run','swim'].map(m=>`<span class="chip ${m}">${counts[m]} ${m==='run'||m==='swim'?m+(counts[m]===1?'':'s'):m}</span>`).join('')}</div></div>`;
  if(lifts.length)h+=`<div class="panel gym"><div class="row" style="justify-content:space-between"><div class="eyebrow">Strength trend</div>
    <select id="histEx" data-f="histEx" style="padding:6px 8px" aria-label="Choose lift">${lifts.map(l=>`<option value="${l}" ${l===histEx?'selected':''}>${esc(gx(l)?.n||l)}</option>`).join('')}</select></div>
    ${lastPt?`<div><span style="font-family:var(--f-display);font-size:32px;font-weight:700" class="num">${fw(Math.round(lastPt.v*2)/2)} kg</span> <span class="small muted">${asl?`assistance · best set ${fw(lastPt.top.w)} kg × ${lastPt.top.r}`:`estimated 1-rep max · best set ${fw(lastPt.top.w)} × ${lastPt.top.r}`}</span></div>`:''}
    ${chart(ser,asl?'Assistance over time':undefined)}<p class="small muted">${asl?'The least assistance you used each session. Lower is better: the line going down means you are getting stronger.':'Estimated from your best set each session (weight × (1 + reps ÷ 30)).'}</p></div>`;
  if(runs.length)h+=`<div class="panel run"><div class="eyebrow">5K tests</div>${runs.map(r=>`<div class="row" style="justify-content:space-between"><span>${nice(r.date)}</span><b class="num">${esc(r.log.test)}</b></div>`).join('')}</div>`;
  h+=`<div class="hist">${SESS.map(s=>`<div class="hcard ${s.mode}"><div class="row"><span class="chip">${{gym:'Gym',home:'Home',run:'Run',swim:'Swim'}[s.mode]}</span><span class="small muted">${nice(s.date)}</span></div>
    <b>${esc(s.title)}</b><div class="small muted">${esc(summary(s))}</div>${s.notes?`<div class="small">“${esc(s.notes)}”</div>`:''}
    <div class="links">${delArm===s.id?`<button class="link" style="color:var(--gym)" data-act="del" data-id="${s.id}">Tap again to delete</button><button class="link" data-act="delcancel">Keep it</button>`:`<button class="link" data-act="delarm" data-id="${s.id}">Delete</button>`}</div></div>`).join('')}</div>`;
  return h}

/* ---------- plan ---------- */
let resetArm=false;
function renderPlan(){const p=paces(S.fiveK);
  return`<header class="top"><div><div class="eyebrow">Goal: get stronger</div><h1>Your plan</h1></div>${syncTag()}</header>
  <details class="panel" ${SESS.length?'':'open'}><summary><h2>How it works</h2></summary>
   <p><b>1. Pick a workout.</b> On Today, tap Gym, Home, Run or Swim and choose a session. There's no schedule: train when it suits you. A good week for getting stronger is three strength sessions and one cardio session.</p>
   <p><b>2. Log as you go.</b> Sets start with last time's numbers. Adjust the weight or reps, then tap ✓. A rest timer starts on its own. Skip anything you don't want to do: only ticked sets are saved. Tap Swap if a machine is taken.</p>
   <p><b>3. Tap Finish.</b> Nothing is saved or changes in your plan until you do. Switch workout drops the session without saving.</p>
   <h3>Progress is automatic</h3>
   <p>Hit the top of the rep range on every set, and next time the app makes it harder:</p>
   <ul class="small">
    <li><b>Weights</b> go up by the exercise's step (shown below).</li>
    <li><b>Assisted machines</b> give you less help. Lower is harder.</li>
    <li><b>Bodyweight moves</b> level up to a harder variation.</li>
   </ul>
   <p>Miss the top of the range, and you keep the same weight or level and aim for one more rep.</p>
   <h3>Make it yours</h3>
   <ul class="small">
    <li><b>Gym and Home routines:</b> the presets use well-tested templates (full body, upper/lower and, for the gym, push/pull/legs) that train each muscle about twice a week. Pick one template and stick with it for a few months, or build your own with Manage routines.</li>
    <li><b>My exercises:</b> add your own gym exercises (barbell, dumbbell, machine, assisted, timed or bodyweight) or home exercises (a ladder of harder variations).</li>
    <li><b>Runs and swims:</b> pick any session. The app suggests the next one so you work through the cycle. Test sessions measure your progress: a new 5K time updates your treadmill speeds, and each swim cycle makes send-offs 15 s faster.</li>
   </ul>
   <p class="small muted">Your data is saved only on this device. Export a backup now and then (see Backup below).</p></details>
  <div class="panel gym"><h2>Gym routines</h2>
   <p class="small muted">Tap a routine to see its exercises and current weights.</p>
   <div class="rlist">${routines().map(r=>{const ex=routineEx(r);return`<details><summary><b>${esc(r.n)} <span class="small muted">· ${ex.length} exercises</span></b></summary><div class="small muted">${ex.map(id=>{const e=gx(id),L=S.lifts[id];return esc(e.n)+(e.k==='t'||e.k==='r'?'':' '+kgTxt(L?L.w:e.start,e.k))}).join(' · ')||'No exercises'}</div></details>`}).join('')||'<p class="muted">No routines yet.</p>'}</div>
   <p class="small muted">Weight steps: +2.5 kg upper-body barbell, +5 kg lower-body barbell, +2 kg dumbbells, +5 kg most machines. Dumbbell weights are per hand.</p>
   <div class="row"><button class="btn" data-act="edit" data-v="routines-gym">Manage routines</button><button class="btn" data-act="edit" data-v="exlist">My exercises</button></div></div>
  <div class="panel home"><h2>Home routines</h2>
   <div class="rlist">${routines('home').map(r=>{const ex=routineEx(r,'home');return`<details><summary><b>${esc(r.n)} <span class="small muted">· ${ex.length} exercises</span></b></summary><div class="small muted">${ex.map(id=>esc(exName('home',id))).join(' · ')||'No exercises'}</div></details>`}).join('')||'<p class="muted">No routines yet.</p>'}</div>
   <div class="row"><button class="btn" data-act="edit" data-v="routines-home">Manage routines</button><button class="btn" data-act="edit" data-v="exlist">My exercises</button></div></div>
  <div class="panel run"><h2>Running · cycle ${S.runCycle}</h2>
   <label class="small muted" for="fivek">Current 5K time</label>
   <div class="row"><input id="fivek" data-f="fiveK" value="${mmss(S.fiveK)}" style="padding:8px;width:100px;font-size:16px" inputmode="numeric"><span class="small muted">Change it and every speed below updates.</span></div>
   <div class="row num small"><span>Easy <b>${f1(p.E)}</b></span><span>Long <b>${f1(p.L)}</b></span><span>Tempo <b>${f1(p.T)}</b></span><span>Interval <b>${f1(p.I)}</b> km/h</span></div>
   <div class="tw"><table class="t">${runPlan().map((r,i)=>`<tr class="${i===S.q.run?'cur':''}"><td class="num">${i+1}</td><td>${esc(r.n)}${i===S.q.run?'<span class="tag">suggested</span>':''}</td><td class="muted">${r.t}</td></tr>`).join('')}</table></div>
   <p class="small muted">The Test session is a 5K time trial. Your new time sets the speeds for the next cycle.</p>
   <div class="row"><button class="btn" data-act="edit" data-v="runlist">Manage runs</button></div></div>
  <div class="panel swim"><h2>Swimming · cycle ${S.swimCycle}</h2>
   <p class="small">“Leave every 3:00” means you push off the wall every 3 minutes. Whatever is left after your 50 m is rest. Each cycle the send-offs get 15 seconds faster.</p>
   <div class="tw"><table class="t">${swimPlan().map((w,i)=>`<tr class="${i===S.q.swim?'cur':''}"><td class="num">${i+1}</td><td>${esc(w.n)}${i===S.q.swim?'<span class="tag">suggested</span>':''}</td><td class="muted">${w.t}</td><td class="num">${swimDist(w)} m</td></tr>`).join('')}</table></div>
   ${S.swim400?`<p class="small">Last 400 m test: <b class="num">${mmss(S.swim400)}</b></p>`:''}
   <div class="row"><button class="btn" data-act="edit" data-v="swimlist">Manage swims</button></div></div>
  <div class="panel"><h2>Backup</h2><p class="small muted">Your data lives only in this browser on this device. Download a backup now and then, and use it to move to a new phone.</p>
   <p class="small">Last backup: <b>${lsGet('mp_lastExport')?nice(lsGet('mp_lastExport')):'never'}</b> · ${SESS.length} sessions</p>
   <div class="row"><button class="btn" data-act="export">Export backup</button><label class="btn" for="importFile">Import backup</label>
   <input id="importFile" type="file" accept="application/json,.json" data-f="import" hidden></div></div>
  <div class="panel"><h2>Start over</h2><p class="small muted">Clears weights, levels and where you are in the run and swim plans. Your history, routines and other plan edits stay.</p>
   <div>${resetArm?`<button class="btn danger" data-act="reset">Tap again to reset the plan</button>`:`<button class="btn" data-act="resetarm">Reset plan</button>`}</div></div>`}

/* ---------- sheet ---------- */
function renderSheet(){const el=$('#sheet');if(!sheet){el.innerHTML='';return}
  let h='';
  if(sheet.t==='choose'){const m=sheet.mode;
    if(m==='gym'||m==='home'){const R=routines(m);h=`<h2>Choose a ${m} routine</h2>`+(R.length?R.map(r=>{const last=SESS.find(s=>s.mode===m&&s.rid===r.id),n=routineEx(r,m).length;
        return`<button class="opt" data-act="pick" data-mode="${m}" data-k="${esc(r.id)}" ${n?'':'disabled'}><span><b>${esc(r.n)}</b><br><span class="small muted">${n} exercise${n===1?'':'s'} · about ${estMin(m,r)} min</span></span><span class="small muted">${last?nice(last.date):''}</span></button>`}).join('')
        :'<p class="muted">No routines yet.</p>')+`<button class="btn" data-act="edit" data-v="routines-${m}">Manage routines</button>`}
    else{const run=m==='run',L=run?runPlan():swimPlan(),q=run?S.q.run:S.q.swim;
      h=`<h2>Choose a ${m}</h2>`+L.map((r,i)=>{const last=SESS.find(s=>s.mode===m&&s.title===r.n);
        return`<button class="opt ${i===q?'cur':''}" data-act="pick" data-mode="${m}" data-k="${i}"><span><b>${esc(r.n)}</b><br><span class="small muted">${esc(r.t)} · ${run?`about ${estMin('run',i)} min`:swimDist(r)+' m'}${last?' · last '+nice(last.date):''}</span></span><span class="small muted">${i===q?'suggested':''}</span></button>`}).join('')
        +`<button class="btn" data-act="edit" data-v="${m}list">Manage ${m}s</button>`}
    h=`<div class="${m}" style="display:flex;flex-direction:column;gap:8px">${h}</div>`}
  else if(sheet.t==='swap'){const it=S.active.items[sheet.i];const base=gx(it.base);const opts=[it.base,...(base?.alts||[])].filter(id=>id!==it.ex&&gx(id));
    const rest=gymIds().filter(id=>id!==it.ex&&!opts.includes(id)).sort((a,b)=>gx(a).n.localeCompare(gx(b).n));
    const opt=g=>id=>{const x=gx(id);return`<button class="opt" data-act="doswap" data-id="${id}" data-g="${g}" data-name="${esc(x.n.toLowerCase())}"><span><b>${esc(x.n)}</b></span><span class="small muted num">${x.k==='t'||x.k==='r'?'':kgTxt(S.lifts[id]?.w??x.start,x.k)}</span></button>`};
    h=`<h2>Swap ${esc(it.name)}</h2><p class="small muted">Machine taken or something doesn't feel right? Each option keeps its own weight history. This only changes today's session.</p><input type="search" data-f="swapq" placeholder="Search exercises" aria-label="Search exercises" autocomplete="off">`+
      (opts.length?`<div class="eyebrow" data-gh="s">Suggested</div>`+opts.map(opt('s')).join(''):'')+`<div class="eyebrow" data-gh="a">All exercises, A–Z</div>`+rest.map(opt('a')).join('')+`<p class="small muted" id="swapnone" hidden>No exercise matches. You can create one in Plan → My exercises.</p>`}
  else if(sheet.t==='switch'){h=`<h2>Switch workout?</h2><p>This drops today's ${esc(S.active.title)} without saving. Nothing in your plan changes.</p>
    <button class="btn danger block" data-act="discard">Drop it and pick again</button>`}
  el.innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true"><button class="xbtn" data-act="close" aria-label="Close">✕</button>${h}<button class="btn block" data-act="close">Cancel</button></div></div>`}


/* ===================== PLAN EDITOR ===================== */
// ED holds the editor being shown (view==='edit'). Inputs write straight into ED via data-e paths; Save commits to S.plan.
let ED=null;
const edDirty=()=>!!(ED&&(ED.dirty||ED.ret?.dirty));
function setP(o,path,v){if(o===ED)ED.dirty=true;const k=path.split('.');const last=k.pop();k.reduce((a,x)=>a[x],o)[last]=v}
const getP=(o,path)=>path.split('.').reduce((a,x)=>a?.[x],o);
const numOr=(v,d)=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:d};
const intOr=(v,d,min=0)=>Math.max(min,Math.round(numOr(v,d)));
const fld=(label,path,val,ty='n',cls='')=>`<label class="${cls}">${label}<input data-e="${path}" inputmode="${ty==='s'?'text':ty==='t'?'numeric':'decimal'}" value="${esc(val)}" ${ty==='t'?'placeholder="m:ss"':''}></label>`;
const sel=(label,path,val,opts,cls='')=>`<label class="${cls}">${label}<select data-e="${path}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
const mvBtns=(path,i,n)=>`<button class="btn sm" data-act="e-mv" data-p="${path}" data-i="${i}" data-d="-1" ${i===0?'disabled':''} aria-label="Move up">↑</button><button class="btn sm" data-act="e-mv" data-p="${path}" data-i="${i}" data-d="1" ${i===n-1?'disabled':''} aria-label="Move down">↓</button><button class="btn sm" data-act="e-rm" data-p="${path}" data-i="${i}" aria-label="Remove">✕</button>`;
const edHead=(eyebrow,title)=>`<header class="top"><div><div class="eyebrow">${eyebrow}</div><h1>${esc(title)}</h1></div></header>`;
const edFoot=(resetLabel)=>`<div class="panel"><div class="row"><button class="btn primary" data-act="e-save">Save</button><button class="btn" data-act="e-cancel">Cancel</button></div>${resetLabel?`<button class="link" data-act="e-reset">${resetLabel}</button>`:''}</div>`;
const exName=(m,id)=>{if(m==='gym')return gx(id)?.n||id;const x=hx(id);return x?x.lv[homeLv(x,id)][0]:id};
const isCustom=(m,id)=>!!(m==='gym'?P().gymEx:P().homeEx)?.[id];

// Run/swim blocks are edited as friendly strings (metres, m:ss) and converted back on save.
const runToEd=b=>({l:b.l,k:b.k,z:b.z,note:b.note||'',min:b.min??'',n:b.n??'',m:b.k==='reps'&&b.km?fw(b.km*1000):'',dur:b.k==='reps'&&!b.km&&b.sec?mmss(b.sec):'',rec:b.rec?mmss(b.rec):'',recT:b.recT||'walk',km:b.k==='dist'?b.km:''});
function runFromEd(e){const b={l:String(e.l||'').trim()||'Run',k:e.k,z:e.z,note:String(e.note||'').trim()};
  if(e.k==='reps'){b.n=intOr(e.n,4,1);b.km=numOr(e.m,0)/1000||0;b.sec=b.km?0:(parseT(e.dur)||60);b.rec=parseT(e.rec)||0;b.recT=String(e.recT||'walk').trim()}
  else if(e.k==='dist')b.km=Math.max(.1,numOr(e.km,1));
  else b.min=Math.max(1,numOr(e.min,10));
  return b}
const swimToEd=b=>({l:b.l,n:b.n,d:b.d,txt:b.txt||'',on:b.on?mmss(b.on):'',rest:b.rest||''});
const swimFromEd=e=>({l:String(e.l||'').trim()||'Swim',n:intOr(e.n,1,1),d:intOr(e.d,50,25),txt:String(e.txt||'').trim(),on:parseT(e.on)||0,rest:intOr(e.rest,0)});

function openEd(t,o={}){
  if(t==='ex'){const m=o.mode,src=o.id?(m==='gym'?P().gymEx:P().homeEx)[o.id]:null;
    const d=m==='gym'?Object.assign({n:'',k:'mc',lo:8,hi:12,s:3,inc:5,start:20,rest:90,cue:''},src&&clone(src))
      :Object.assign({u:'reps',lo:8,hi:15,s:3,rest:60,cue:''},src&&clone(src),{lvText:src?src.lv.map(l=>l[0]).join('\n'):''});
    ED={t:'ex',mode:m,id:o.id||null,ret:o.ret||null,draft:d}}
  else if(t.startsWith('routines'))ED={t:'routines',m:t.split('-')[1]||o.mode||'gym'};
  else if(t==='routine'){const m=o.mode||'gym',r=o.i>=0?routines(m)[o.i]:{n:'',ex:[]};ED={t:'routine',m,i:o.i,id:r.id||null,draft:{n:r.n,ex:routineEx(r,m),exo:exoFor(m)}}}
  else if(t==='exlist')ED={t:'exlist'};
  else if(t==='runlist')ED={t:'runlist'};
  else if(t==='swimlist')ED={t:'swimlist'};
  else if(t==='run'){const r=o.i>=0?runPlan()[o.i]:{t:'Easy',n:'New run',b:[WU1,T_('Run',20,'E','steady'),CD3]};
    ED={t:'run',i:o.i,draft:{t:r.t,n:r.n,b:r.b.map(runToEd)}}}
  else if(t==='swim'){const w=o.i>=0?swimPlan()[o.i]:{t:'Endurance',n:'New swim',b:[{l:'Warm-up',n:1,d:100,txt:'easy, any stroke',on:0,rest:0},{l:'Main',n:6,d:50,txt:'freestyle',on:180,rest:0},{l:'Cool-down',n:1,d:50,txt:'easy',on:0,rest:0}]};
    ED={t:'swim',i:o.i,draft:{t:w.t,n:w.n,b:w.b.map(swimToEd)}}}
  view='edit';sheet=null;render();window.scrollTo(0,0)}

const curList=e=>e.draft.ex;
const curPath=()=>'draft.ex';
const exoFor=m=>Object.fromEntries((m==='gym'?gymIds():homeIds()).map(id=>{const x=m==='gym'?gx(id):hx(id);return[id,{s:x.s,lo:x.lo,hi:x.hi,rest:x.rest,inc:x.inc??0}]}));
function exRows(e,m){const ids=curList(e),path=curPath(e);
  return ids.map((id,i)=>{const x=m==='gym'?gx(id):hx(id),p=`draft.exo.${id}`,o=e.draft.exo[id],timed=m==='gym'?x.k==='t':x.u==='sec',noW=m==='home'||x.k==='t'||x.k==='r';
      return`<section class="ex ${m}"><div class="ex-top"><div><div class="ex-name">${esc(exName(m,id))}</div>${isCustom(m,id)?'<div class="small muted">Custom exercise</div>':''}</div><div class="row" style="flex-wrap:nowrap">${mvBtns(path,i,ids.length)}</div></div>
      <div class="logs">${fld('Sets',p+'.s',o.s)}${fld(timed?'Min sec':'Min reps',p+'.lo',o.lo)}${fld(timed?'Max sec':'Max reps',p+'.hi',o.hi)}${fld('Rest (sec)',p+'.rest',o.rest)}${noW?'':fld(isAs(x.k)?'Step (kg less assist)':'Step (kg)',p+'.inc',o.inc)}</div></section>`}).join('')}
function addExPanel(e,m,label){const ids=curList(e),all=(m==='gym'?gymIds():homeIds()).filter(id=>!ids.includes(id));
  return`<div class="panel"><label class="eyebrow" for="addex">${label}</label>
     <select id="addex" data-add="1" style="padding:10px;font-size:16px"><option value="">Choose…</option>${all.map(id=>`<option value="${id}">${esc(exName(m,id))}${isCustom(m,id)?' (custom)':''}</option>`).join('')}</select>
     <div><button class="btn" data-act="e-newex" data-mode="${m}">Create a custom exercise</button></div></div>`}

function renderEditor(){const e=ED;
  if(e.t==='routines'){const m=e.m,R=routines(m),missing=PRESETS[m].filter(p=>!R.some(r=>r.id===p.id));
    return`<div class="ed">${edHead(m==='gym'?'Gym':'Home','Routines')}
    <p class="small muted">Make as many as you like. You choose one every time you start a ${m} session. Changes save straight away.</p>
    <div class="hist">${R.map((r,i)=>`<div class="edrow ${m}"><span><b>${esc(r.n)}</b><br><span class="small muted">${routineEx(r,m).length} exercises · about ${estMin(m,r)} min</span></span>
      <span class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="e-open" data-v="routine" data-i="${i}">Edit</button>${mvBtns('routines',i,R.length)}</span></div>`).join('')||'<div class="empty">No routines. Create one below.</div>'}</div>
    <div class="row"><button class="btn" data-act="e-open" data-v="routine" data-i="-1">New routine</button><button class="btn" data-act="e-cancel">Done</button></div>
    ${missing.length?`<div class="panel"><div class="eyebrow">Preset routines you removed</div>${missing.map(p=>`<div class="edrow"><span><b>${esc(p.n)}</b><br><span class="small muted">${esc(p.g)}</span></span><button class="btn sm" data-act="e-addpreset" data-id="${p.id}">Add back</button></div>`).join('')}</div>`:''}</div>`}
  if(e.t==='routine'){const d=e.draft,m=e.m;
    return`<div class="ed">${edHead(m==='gym'?'Gym routine':'Home routine',e.i>=0?'Edit routine':'New routine')}
    <section class="ex ${m}"><div class="logs">${fld('Name','draft.n',d.n,'s','full')}</div>
    <p class="small muted">Sets, reps, rest${m==='gym'?' and weight step':''} apply everywhere an exercise is used.${m==='home'?' Each exercise levels up on its own as you hit the top of its range.':''}</p></section>
    ${exRows(e,m)||'<div class="empty">No exercises yet. Add one below.</div>'}
    ${addExPanel(e,m,'Add an exercise')}
    ${e.i>=0?`<div><button class="btn danger" data-act="e-delroutine">Delete this routine</button></div>`:''}
    ${edFoot('')}</div>`}
  if(e.t==='ex'){const m=e.mode,d=e.draft;
    const f=m==='gym'?`${fld('Name','draft.n',d.n,'s','full')}
      ${sel('Type','draft.k',d.k,[['bb','Barbell'],['db','Dumbbell (kg per hand)'],['mc','Machine or cable'],['as','Assisted machine (kg of help)'],['t','Timed hold'],['r','Reps only (bodyweight)']],'full')}
      ${fld('Sets','draft.s',d.s)}${fld(d.k==='t'?'Min sec':'Min reps','draft.lo',d.lo)}${fld(d.k==='t'?'Max sec':'Max reps','draft.hi',d.hi)}${fld('Rest (sec)','draft.rest',d.rest)}
      ${d.k==='t'||d.k==='r'?'':fld(isAs(d.k)?'Step (kg less assist)':'Step (kg)','draft.inc',d.inc)+fld(isAs(d.k)?'Start assist (kg)':'Start (kg)','draft.start',d.start)}
      ${isAs(d.k)?'<p class="small muted full">Enter how much the machine helps you. Hit the top of the rep range on every set and the next session uses the step less assistance.</p>':''}`
     :`<label class="full">Variations, one per line, easiest first<textarea data-e="draft.lvText" rows="4" placeholder="Wall push-up&#10;Incline push-up&#10;Push-up">${esc(d.lvText)}</textarea></label>
      ${sel('Counts','draft.u',d.u,[['reps','Reps'],['sec','Seconds']],'full')}
      ${fld('Sets','draft.s',d.s)}${fld(d.u==='sec'?'Min sec':'Min reps','draft.lo',d.lo)}${fld(d.u==='sec'?'Max sec':'Max reps','draft.hi',d.hi)}${fld('Rest (sec)','draft.rest',d.rest)}`;
    return`<div class="ed">${edHead(m==='gym'?'Gym exercise':'Home exercise',e.id?'Edit exercise':'New exercise')}
    <section class="ex ${m}"><div class="logs">${f}${fld('Notes / form cue','draft.cue',d.cue,'s','full')}</div>
    ${m==='home'?'<p class="small muted">Hit the top of the range on every set and you move to the next variation.</p>':''}</section>
    ${e.id?`<div><button class="btn danger" data-act="e-delex">Delete this exercise</button></div>`:''}${edFoot('')}</div>`}
  if(e.t==='exlist'){const list=m=>Object.entries((m==='gym'?P().gymEx:P().homeEx)||{});
    const sec=(m,title)=>`<div class="panel ${m}"><h2>${title}</h2>${list(m).map(([id,x])=>`<div class="edrow"><span><b>${esc(m==='gym'?x.n:x.lv[0][0])}</b><br><span class="small muted">${x.s} × ${x.lo}–${x.hi}${(m==='gym'?x.k==='t':x.u==='sec')?' s':''}${m==='home'?` · ${x.lv.length} level${x.lv.length>1?'s':''}`:''}</span></span><button class="btn sm" data-act="e-editex" data-mode="${m}" data-id="${id}">Edit</button></div>`).join('')||'<p class="small muted">None yet.</p>'}
      <div><button class="btn" data-act="e-newex" data-mode="${m}">New ${m} exercise</button></div></div>`;
    return`<div class="ed">${edHead('Edit plan','My exercises')}<p class="small muted">Create exercises, then add them to a routine.</p>
    ${sec('gym','Gym')}${sec('home','Home')}<div><button class="btn" data-act="e-cancel">Done</button></div></div>`}
  if(e.t==='runlist'||e.t==='swimlist'){const run=e.t==='runlist',L=run?runPlan():swimPlan(),q=run?S.q.run:S.q.swim,c=run?'run':'swim',pp=paces(S.fiveK);
    return`<div class="ed">${edHead('Edit plan',run?'Runs':'Swims')}
    <p class="small muted">You can pick any session when you start. The app suggests them in this order, then the cycle repeats. ${run?'Finishing a Test session saves your 5K time, updates your speeds and starts a new cycle.':'Finishing a Test session starts a new cycle with send-offs 15 s faster.'} Changes save straight away.</p>
    <div class="hist">${L.map((r,i)=>`<div class="edrow ${c} ${i===q?'cur':''}"><span><b>${i+1}. ${esc(r.n)}</b><br><span class="small muted">${esc(r.t)} · ${run?`about ${Math.round(runMin(r,pp))} min`:swimDist(r)+' m'}${i===q?' · suggested':''}</span></span>
      <span class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="e-open" data-v="${c}" data-i="${i}">Edit</button>${mvBtns('list',i,L.length)}</span></div>`).join('')}</div>
    <div class="row"><button class="btn" data-act="e-open" data-v="${c}" data-i="-1">Add a ${c}</button><button class="btn" data-act="e-cancel">Done</button></div>
    ${P()[c]?`<button class="link" data-act="e-reset">Restore the default ${c} plan</button>`:''}</div>`}
  if(e.t==='run'){const d=e.draft;
    return`<div class="ed">${edHead('Run',e.i>=0?'Edit run':'New run')}
    <section class="ex run"><div class="logs">${fld('Name','draft.n',d.n,'s','full')}${sel('Type','draft.t',d.t,RUN_TYPES.map(x=>[x,x]),'full')}</div>
    ${d.t==='Test'?'<p class="small muted">Test sessions ask for your 5K time, which updates your speeds and starts a new cycle.</p>':''}</section>
    ${d.b.map((b,i)=>{const p='draft.b.'+i;return`<section class="ex run"><div class="ex-top"><div class="eyebrow">Block ${i+1}</div><div class="row" style="flex-wrap:nowrap">${mvBtns('draft.b',i,d.b.length)}</div></div>
      <div class="logs">${fld('Label',p+'.l',b.l,'s')}${sel('Kind',p+'.k',b.k,[['time','Time'],['reps','Repeats'],['dist','Distance']])}${sel('Speed',p+'.z',b.z,Object.entries(ZONE))}
      ${b.k==='time'?fld('Minutes',p+'.min',b.min):b.k==='dist'?fld('Distance (km)',p+'.km',b.km)
        :fld('Repeats',p+'.n',b.n)+fld('Each (m)',p+'.m',b.m)+fld('or each (m:ss)',p+'.dur',b.dur,'t')+fld('Recovery (m:ss)',p+'.rec',b.rec,'t')+fld('Recovery is',p+'.recT',b.recT,'s','full')}
      ${fld('Note','draft.b.'+i+'.note',b.note,'s','full')}</div></section>`}).join('')}
    <div><button class="btn" data-act="e-addblock">Add a block</button></div>${edFoot('')}</div>`}
  if(e.t==='swim'){const d=e.draft;
    return`<div class="ed">${edHead('Swim',e.i>=0?'Edit swim':'New swim')}
    <section class="ex swim"><div class="logs">${fld('Name','draft.n',d.n,'s','full')}${sel('Type','draft.t',d.t,SWIM_TYPES.map(x=>[x,x]),'full')}</div>
    <p class="small muted">"Leave every" is the send-off time (it gets 15 s faster each cycle). Leave it empty to use a fixed rest instead.${d.t==='Test'?' Test sessions ask for your 400 m time.':''}</p></section>
    ${d.b.map((b,i)=>{const p='draft.b.'+i;return`<section class="ex swim"><div class="ex-top"><div class="eyebrow">Block ${i+1}</div><div class="row" style="flex-wrap:nowrap">${mvBtns('draft.b',i,d.b.length)}</div></div>
      <div class="logs">${fld('Label',p+'.l',b.l,'s')}${fld('Repeats',p+'.n',b.n)}${fld('Distance (m)',p+'.d',b.d)}
      ${fld('What to swim',p+'.txt',b.txt,'s','full')}${fld('Leave every',p+'.on',b.on,'t')}${fld('or rest (sec)',p+'.rest',b.rest)}</div></section>`}).join('')}
    <div><button class="btn" data-act="e-addblock">Add a block</button></div>${edFoot('')}</div>`}
  return''}

function edAddEx(id){curList(ED).push(id);ED.dirty=true;render()}
function edBack(){if(ED?.ret){ED=ED.ret;render()}else if(ED&&(ED.t==='run'||ED.t==='swim'))openEd(ED.t+'list');else if(ED?.t==='routine')openEd('routines',{mode:ED.m});else{ED=null;view='plan';render()}window.scrollTo(0,0)}
function commitList(c,L,q){P()[c]=L;S.q[c]=q;clampQ();save()}
// Sets/reps/rest/step edits are stored as differences from each exercise's definition.
function saveExo(m,draftExo){const base=m==='gym'?GYM:HOME,cust=(m==='gym'?P().gymEx:P().homeEx)||{},exo=Object.assign({},P().exo?.[m]);
  for(const[id,o]of Object.entries(draftExo)){const def=cust[id]||base[id];if(!def)continue;
    let lo=intOr(o.lo,def.lo,1),hi=intOr(o.hi,def.hi,1);if(hi<lo)[lo,hi]=[hi,lo];
    const v={s:intOr(o.s,def.s,1),lo,hi,rest:intOr(o.rest,def.rest),inc:Math.max(0,numOr(o.inc,def.inc??0))};
    const diff={};for(const k in v)if(v[k]!==(def[k]??0))diff[k]=v[k];
    if(Object.keys(diff).length)exo[id]=diff;else delete exo[id]}
  P().exo=Object.assign({},P().exo,{[m]:exo})}

function edSave(){const e=ED;
  if(e.t==='routine'){const d=e.draft,n=String(d.n||'').trim();if(!n){toast('Give the routine a name.');return}if(!d.ex.length){toast('Add at least one exercise.');return}
    const m=e.m;saveExo(m,d.exo);const R=clone(routines(m)),r={id:e.id||'r_'+uid(),n,ex:d.ex.slice()};if(e.i>=0)R[e.i]=r;else R.push(r);
    P()[RKEY[m]]=R;save();toast(e.i>=0?'Routine saved.':'Routine created.');openEd('routines',{mode:m});return}
  if(e.t==='ex'){const m=e.mode,d=e.draft;let x;
    let lo=intOr(d.lo,8,1),hi=intOr(d.hi,12,1);if(hi<lo)[lo,hi]=[hi,lo];
    if(m==='gym'){const n=String(d.n||'').trim();if(!n){toast('Give the exercise a name.');return}
      const w=d.k!=='t'&&d.k!=='r';x={n,k:d.k,lo,hi,s:intOr(d.s,3,1),rest:intOr(d.rest,90),inc:w?Math.max(0,numOr(d.inc,2.5)):0,start:w?Math.max(0,numOr(d.start,20)):0,cue:String(d.cue||'').trim(),alts:[]}}
    else{const lv=String(d.lvText||'').split('\n').map(s=>s.trim()).filter(Boolean);if(!lv.length){toast('Add at least one variation.');return}
      const cue=String(d.cue||'').trim();x={u:d.u,lo,hi,s:intOr(d.s,3,1),rest:intOr(d.rest,60),start:0,cue,lv:lv.map(n=>[n,cue])}}
    const key=m==='gym'?'gymEx':'homeEx',id=e.id||'c_'+uid();P()[key]=Object.assign({},P()[key],{[id]:x});
    if(P().exo?.[m])delete P().exo[m][id];save();
    if(e.ret){const r=e.ret;if(!e.id)curList(r).push(id);r.draft.exo[id]={s:x.s,lo:x.lo,hi:x.hi,rest:x.rest,inc:x.inc??0}}
    toast(e.id?'Exercise updated.':'Exercise created.');if(e.ret)edBack();else openEd('exlist');return}
  if(e.t==='run'||e.t==='swim'){const d=e.draft,run=e.t==='run';if(!d.b.length){toast('Add at least one block.');return}
    const r={t:d.t,n:String(d.n||'').trim()||(run?'Run':'Swim'),b:d.b.map(run?runFromEd:swimFromEd)};
    const L=clone(run?runPlan():swimPlan());if(e.i>=0)L[e.i]=r;else L.push(r);
    commitList(e.t,L,S.q[e.t]);toast(run?'Run saved.':'Swim saved.');openEd(e.t+'list')}}

function edClick(a,b){const e=ED,i=+b.dataset.i;
  switch(a){
   case'edit':openEd(b.dataset.v);return;
   case'e-cancel':if(e.dirty&&!confirm('Discard your unsaved changes?'))return;edBack();return;
   case'e-save':edSave();return;
   case'e-open':openEd(b.dataset.v,{i,mode:e.m});return;
   case'e-newex':openEd('ex',{mode:b.dataset.mode,ret:e.t==='routine'?e:null});return;
   case'e-addpreset':{const m=e.m,pr=PRESETS[m].find(x=>x.id===b.dataset.id);P()[RKEY[m]]=[...clone(routines(m)),presetRoutine(pr,m)];save();render();toast(`${pr.n} added back.`);return}
   case'e-delroutine':{const m=e.m;if(!confirm(`Delete the routine "${routines(m)[e.i].n}"? Past sessions stay in History.`))return;const R=clone(routines(m));R.splice(e.i,1);P()[RKEY[m]]=R;save();toast('Routine deleted.');openEd('routines',{mode:m});return}
   case'e-editex':openEd('ex',{mode:b.dataset.mode,id:b.dataset.id});return;
   case'e-addblock':e.dirty=true;e.draft.b.push(e.t==='run'?runToEd(T_('Run',10,'E','')):swimToEd({l:'Main',n:4,d:50,txt:'freestyle',on:180,rest:0}));render();return;
   case'e-mv':case'e-rm':{const path=b.dataset.p;
     if(path==='routines'){const m=e.m,R=clone(routines(m));
       if(a==='e-rm'){if(!confirm(`Delete the routine "${R[i].n}"? Past sessions stay in History.`))return;R.splice(i,1)}else{const j=i+ +b.dataset.d;[R[i],R[j]]=[R[j],R[i]]}
       P()[RKEY[m]]=R;save();render();return}
     if(path==='list'){const c=e.t==='runlist'?'run':'swim',L=clone(c==='run'?runPlan():swimPlan());let q=S.q[c];
       if(a==='e-rm'){if(L.length<2){toast('Keep at least one session.');return}if(!confirm(`Remove "${L[i].n}" from the plan?`))return;L.splice(i,1);if(i<q)q--}
       else{const j=i+ +b.dataset.d;[L[i],L[j]]=[L[j],L[i]];if(q===i)q=j;else if(q===j)q=i}
       commitList(c,L,q);render();return}
     const L=getP(e,path);e.dirty=true;if(a==='e-rm')L.splice(i,1);else{const j=i+ +b.dataset.d;[L[i],L[j]]=[L[j],L[i]]}render();return}
   case'e-reset':{
     const c=e.t==='runlist'?'run':'swim';if(!confirm(`Restore the default ${c} plan? Your edited ${c} sessions will be replaced.`))return;
     delete P()[c];S.q[c]=0;save();render();toast(`Default ${c} plan restored.`);return}
   case'e-delex':{const m=e.mode,id=e.id,key=m==='gym'?'gymEx':'homeEx';if(!confirm('Delete this exercise? It is removed from every routine it is in. Past sessions keep it.'))return;
     delete P()[key][id];const dk=m+'Day';if(P()[dk])for(const d of ROT)P()[dk][d]=P()[dk][d].filter(x=>x!==id);
     if(P()[RKEY[m]])P()[RKEY[m]]=P()[RKEY[m]].map(r=>({...r,ex:r.ex.filter(x=>x!==id)}));
     if(P().exo?.[m])delete P().exo[m][id];save();toast('Exercise deleted.');
     if(e.ret){const r=e.ret;r.draft.ex=r.draft.ex.filter(x=>x!==id);delete r.draft.exo[id];edBack()}else openEd('exlist');return}
  }}

/* ---------- timer ---------- */
let tEnd=0,tDur=0,tInt=null,beeped=false,actx=null,wake=null;
function startTimer(sec){tDur=sec;tEnd=Date.now()+sec*1000;beeped=false;clearInterval(tInt);tInt=setInterval(renderTimer,250);renderTimer()}
function stopTimer(){tEnd=0;clearInterval(tInt);renderTimer()}
function renderTimer(){const el=$('#timer'),on=!!(tEnd&&S.active);document.body.classList.toggle('has-timer',on);if(!on){el.innerHTML='';return}
  const left=(tEnd-Date.now())/1000;const over=left<=0;
  if(over&&!beeped){beeped=true;beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
  if(left<-90){stopTimer();return}
  const pct=over?100:100-left/tDur*100;
  el.innerHTML=`<div class="timer ${over?'over':''}"><div class="in"><span class="t num">${over?'Go':mmss(left)}</span>
   <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div><button data-act="t30">+30 s</button><button data-act="tstop">${over?'Close':'Skip'}</button></div></div>`}
function beep(){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.35)}catch(e){}}
async function keepAwake(){try{if('wakeLock'in navigator&&!wake)wake=await navigator.wakeLock.request('screen')}catch(e){wake=null}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake=null;if(S.active)keepAwake()}});
function toast(m){const el=$('#toast');el.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>el.innerHTML='',3500)}

/* ===================== EVENTS ===================== */
document.addEventListener('click',ev=>{
  if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='close'&&ev.target!==b&&b.classList.contains('scrim'))return; // clicks inside sheet
  const s=S.active,i=+b.dataset.i,j=+b.dataset.j;
  switch(a){
   case'tab':if(view==='edit'&&edDirty()&&!confirm('Discard your unsaved changes?'))return;view=b.dataset.v;ED=null;delArm=null;resetArm=false;sheet=null;render();window.scrollTo(0,0);return;
   case'choose':sheet={t:'choose',mode:b.dataset.mode};renderSheet();return;
   case'pick':{const m=b.dataset.mode,k=b.dataset.k;S.active=m==='gym'||m==='home'?buildRoutine(m,k):m==='run'?buildRun(+k):buildSwim(+k);sheet=null;break}
   case'close':sheet=null;renderSheet();return;
   case'switch':sheet={t:'switch'};renderSheet();return;
   case'discard':S.active=null;sheet=null;stopTimer();releaseWake();save();render();window.scrollTo(0,0);return;
   case'swap':sheet={t:'swap',i};renderSheet();return;
   case'doswap':{const old=s.items[sheet.i];const n=gymItem(b.dataset.id,old.base);n.sets=n.sets.slice(0,Math.max(1,old.sets.length));
     while(n.sets.length<old.sets.length)n.sets.push({...n.sets[n.sets.length-1],done:false});s.items[sheet.i]=n;sheet=null;break}
   case'w':{const it=s.items[i],e=gx(it.ex)||{};const step=it.k==='bb'?2.5:it.k==='db'?(e.inc||2):(e.inc||5);
     const nv=Math.max(0,(+it.sets[j].w||0)+step*+b.dataset.d);for(let k=j;k<it.sets.length;k++)if(k===j||!it.sets[k].done)it.sets[k].w=nv;break}
   case'r':{const x=s.items[i].sets[j];const st=s.items[i].u==='sec'?5:1;x.r=Math.max(0,(+x.r||0)+st*+b.dataset.d);break}
   case'tick':{const it=s.items[i],x=it.sets[j];x.done=!x.done;if(x.done){if(j+1<it.sets.length&&!it.sets[j+1].done){it.sets[j+1].w=x.w}startTimer(it.rest);keepAwake()}break}
   case'addset':{const it=s.items[i];const l=it.sets[it.sets.length-1];it.sets.push({...l,done:false});break}
   case'delset':s.items[i].sets.pop();break;
   case'lvl':{const it=s.items[i];it.level=Math.max(0,Math.min((hx(it.ex)?.lv.length||1)-1,it.level+ +b.dataset.d));it.up=false;it.sets.forEach(x=>{if(!x.done)x.r=it.lo});break}
   case'chk':s.checks[+b.dataset.k]=!s.checks[+b.dataset.k];break;
   case'finish':finish();return;
   case'tofinish':$('#finishPanel')?.scrollIntoView({behavior:'smooth',block:'center'});return;
   case't30':tEnd+=30000;tDur+=30;beeped=false;renderTimer();return;
   case'tstop':stopTimer();return;
   case'export':exportData();return;
   case'delarm':delArm=b.dataset.id;render();return;
   case'delcancel':delArm=null;render();return;
   case'del':removeSession(b.dataset.id);delArm=null;render();return;
   case'resetarm':resetArm=true;render();return;
   case'reset':{const keep={fiveK:S.fiveK,plan:S.plan};S=Object.assign(defState(),keep);resetArm=false;save();render();toast('Plan reset. History kept.');return}
   default:if(a==='edit'||a.startsWith('e-')){edClick(a,b);return}return}
  save();render();
  if(a==='pick'){window.scrollTo(0,0);keepAwake()}
});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.dataset.f==='swapq'){const q=t.value.trim().toLowerCase();let n=0;document.querySelectorAll('.sheet .opt[data-name]').forEach(o=>{const show=!q||o.dataset.name.includes(q);o.hidden=!show;n+=show});
    document.querySelectorAll('.sheet [data-gh]').forEach(e=>e.hidden=!document.querySelector(`.sheet .opt[data-g="${e.dataset.gh}"]:not([hidden])`));const z=$('#swapnone');if(z)z.hidden=n>0;return}if(t.dataset.e&&ED&&t.tagName!=='SELECT'){setP(ED,t.dataset.e,t.value);return}
  const f=t.dataset.f;if(!f)return;const s=S.active;
  if(f==='w'||f==='r'){const x=s.items[+t.dataset.i].sets[+t.dataset.j];x[f]=t.value===''?'':(+t.value.replace(',','.'));save();return}
  if(f==='notes'){s.notes=t.value;save();return}
  if(f.startsWith('log.')){s.log[f.slice(4)]=t.value;save();return}
});
document.addEventListener('change',ev=>{const t=ev.target,f=t.dataset.f;
  if(t.tagName==='SELECT'&&ED){if(t.dataset.e){setP(ED,t.dataset.e,t.value);render()}else if(t.dataset.add&&t.value){edAddEx(t.value)}}
  if(f==='histEx'){histEx=t.value;render()}
  if(f==='import'&&t.files&&t.files[0]){importData(t.files[0]);t.value=''}
  if(f==='fiveK'){const v=parseT(t.value);if(v&&v>600&&v<7200){S.fiveK=v;save();render();toast('Run speeds updated.')}else{t.value=mmss(S.fiveK);toast('Enter your 5K time as mm:ss, for example 29:30.')}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){sheet=null;renderSheet()}});

render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
